  <label class="import-button" for="upload">Import JSON<input id="upload" class="visually-hidden" type="file" accept=".json,application/json"></label>
</header>
<main>
  <h1 class="visually-hidden">Resize a design</h1>
  <section class="toolbar" aria-label="Design and target dimensions">
    <label class="source-field" for="sample">Design<select id="sample"></select></label>
    <div class="target-fields">
      <label class="format-field" for="format">Target format<select id="format"><option value="custom">Custom</option><option value="1080,1080">Square post · 1080 × 1080</option><option value="1080,1350">Portrait post · 1080 × 1350</option><option value="1080,1920">Story · 1080 × 1920</option><option value="1920,1080">Widescreen · 1920 × 1080</option><option value="1600,400">Web banner · 1600 × 400</option><option value="728,90">Leaderboard · 728 × 90</option></select></label>
      <div class="dimensions">
        <label for="width">Width<input id="width" type="number" min="1" max="12000" aria-label="Width in pixels"></label>
        <span class="dimension-divider" aria-hidden="true">×</span>
        <label for="height">Height<input id="height" type="number" min="1" max="12000" aria-label="Height in pixels"></label>
        <span class="unit" aria-hidden="true">px</span>
      </div>
      <button id="adapt" class="primary">Adapt layout</button>
    </div>
  </section>
  <div id="status" role="status" aria-live="polite">Loading designs…</div>
  <section class="previews" aria-label="Layout comparison">
    <article><div class="preview-title"><h2>Original</h2><span id="source-size"></span></div><div class="artboard"><button id="source-preview" class="preview-open" aria-label="Enlarge original design" disabled><img id="source" alt="Original design"></button></div></article>
    <article><div class="preview-title"><h2>Adapted</h2><span id="output-size"></span></div><div class="artboard"><button id="output-preview" class="preview-open" aria-label="Enlarge adapted design" disabled><img id="output" alt="Adapted design"></button></div></article>
  </section>
  <section class="details" aria-label="Downloads and diagnostics">
    <div class="downloads"><span class="download-label">Export</span><button id="json" aria-label="Download output JSON" disabled>JSON</button><button id="png" aria-label="Download output PNG" disabled>PNG</button><button id="bundle" aria-label="Download Express viewer bundle" disabled>Express viewer bundle</button></div>
    <details><summary>Checks & rendering notes <span id="warning-count"></span></summary><ul id="warnings"></ul><p>Local diagnostics; official scoring is separate. All content is retained, so very small formats can require tiny text.</p></details>
    <details><summary>Output JSON</summary><pre id="document"></pre></details>
  </section>
</main>
<dialog id="image-viewer" class="image-viewer" aria-labelledby="image-viewer-title">
  <div class="image-viewer-toolbar">
    <div><h2 id="image-viewer-title">Design preview</h2><span id="image-viewer-size"></span></div>
    <div class="image-viewer-actions"><button id="image-viewer-zoom" aria-label="Show image at actual pixel size" aria-pressed="false">100%</button><button id="image-viewer-close" aria-label="Close image viewer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  </div>
  <div class="image-viewer-stage"><div class="image-viewer-content"><img id="image-viewer-image" alt=""></div></div>
</dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
